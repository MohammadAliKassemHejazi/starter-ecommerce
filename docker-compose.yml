# Local development stack for the multi-vendor e-commerce platform.
# Not for production use (see server/Dockerfile and client/Dockerfile).
#
# Quick start:
#   docker compose up -d postgres
#   docker compose run --rm server npm run setup   # first-time DB setup/seed (manual, see note below)
#   docker compose up -d
#
# server/.env is generated separately (gitignored, not part of this file) —
# see the repo README's "Environment variables" section for the full list.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      # LOCAL-DEV-ONLY credential: throwaway, container-internal password.
      # Never reused for any real environment or secret.
      POSTGRES_PASSWORD: devlocal_only_not_a_real_secret
      POSTGRES_DB: ecommerce_dev
    ports:
      # Host port 5434 (not 5432): another local project's postgres already
      # holds 5432 on this machine. Internal container-to-container traffic
      # (server -> postgres) uses the service name on 5432 regardless, so
      # this only affects host-side tools (psql, GUI clients).
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      # Overrides env_file: the app connects to the compose service name,
      # not localhost, when running inside the docker network.
      DB_HOST: postgres
    ports:
      # Host port 5300 (not 3000): another local project's client container
      # already holds host 3000 on this machine. The app listens on 3000
      # *inside* the container regardless (server/.env PORT / Dockerfile
      # EXPOSE) — only the host-side mapping changes, so localhost:5300 is
      # what the browser/Playwright must hit.
      - "5300:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
      # @shared/* resolves to ../../shared relative to baseUrl (src/), which
      # from /app/src lands on container-root /shared — mount the repo's
      # shared/ folder there or every @shared import fails to compile.
      - ./shared:/shared
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    environment:
      # Non-secret, public Next.js build-time vars — safe to inline here.
      # Points at the server's new host mapping (5300, see above).
      NEXT_PUBLIC_BASE_URL_API: http://localhost:5300/api
      NEXT_PUBLIC_BASE_URL_Images: http://localhost:5300
      # authService.ts's signIn/signUp/signOut/getSession calls are relative
      # paths ("/user/auth/login" etc.) meant to hit this client's own BFF
      # proxy (pages/api/user/[...AUTH].ts), overriding httpClient's default
      # baseURL (which points straight at the real backend and has no
      # /user/auth/* route — was a silent 404 with this var unset). README
      # already documents this var; it was just missing from compose.
      NEXT_PUBLIC_BASE_URL_LOCAL_API: http://localhost:3001/api
      # Container-internal, server-only (not NEXT_PUBLIC_*) URL for the client
      # container's own server-side code (getServerSideProps/getStaticProps,
      # pages/api/* routes) to reach the backend over the compose network —
      # "localhost:5300" only resolves from the host/browser, not from inside
      # this container. See client/src/utils/httpClient.ts.
      INTERNAL_API_URL: http://server:3000/api
    ports:
      - "3001:3001"
    volumes:
      - ./client:/app
      - /app/node_modules
      # Same @shared/* resolution requirement as the server service — see
      # that service's comment.
      - ./shared:/shared
    depends_on:
      - server

volumes:
  postgres_data:

# NOTE on `npm run setup` (DB migrate/seed):
# Chosen as a MANUAL step (`docker compose run --rm server npm run setup`),
# not an automatic on-boot command, because:
#   1. Auto-running it in the server service's CMD/entrypoint would re-run
#      seedData() on every container restart, not just first boot — risky
#      against a dev DB that already has real-looking data (live-data
#      safety guardrail).
#   2. A reliable "first boot only" auto-run needs a marker-file/entrypoint
#      script; keeping it manual is simpler and safer for now. Revisit if
#      onboarding friction becomes a real problem.
